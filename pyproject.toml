[project]
name = "sistemas-recomendacion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "ipykernel>=7.2.0",
    "lightgbm>=4.0.0",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "torch>=2.5.1",
    # scikit-surprise requires MSVC compiler on Windows — install via conda instead:
    # conda install -c conda-forge scikit-surprise
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
